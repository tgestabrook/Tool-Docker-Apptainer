## Support libraries that must be rebuilt BEFORE the extensions are compiled
## (UCLv2 image only; see `Docker-LANDIS-II-v8-UCL2-release/Dockerfile`).
##
## The other support libraries are rebuilt *after* the extensions
## (`libraries-v8-release.yaml`); this file exists for the cases where an
## extension has to *compile against* a rebuilt library rather than merely load
## it at runtime.
##
## IMPORTANT: library order matters here, as it does in `libraries-v8-release.yaml`.

## Up to f0b0d68e, Support-Library-Dlls-v8 shipped `Landis.Library.PnETCohorts-v2.dll`
## v2.1.1, which is built against `UniversalCohorts-v1` / `InitialCommunity.Universal`
## (v1). The UCLv2 PnET extensions (PnET-Succession, Output Biomass PnET) reference
## `UniversalCohorts-v2`, so compiling them against that DLL fails with, e.g.:
##
##   error CS0012: The type 'SiteCohorts' is defined in an assembly that is not
##   referenced. You must add a reference to assembly
##   'Landis.Library.UniversalCohorts-v1, Version=1.2.0.0, ...'
##
## Rebuilding the library from its `UCL_update` branch (v2.2, built against
## `UniversalCohorts-v2` / `InitialCommunity.Universal-v2` / `Succession-v10`)
## replaces that DLL in `build/extensions` before the extensions are built.
##
## The copy at the pinned cfd7d2a3 is a UCLv2 build (2.3.0.0, from Library-PnET-Cohort
## main 25d1887), but it references `Climate-v6`, while PnET-Succession de21116b and
## this rebuild use `Climate-v5`. Remove this file (and its Dockerfile step) once the
## PnET extensions move to `Climate-v6`.
- repo: Library-PnET-Cohort
  org: LANDIS-II-Foundation
  ## `UCL_update` branch HEAD, the commit that PnET-Succession's own .csproj
  ## names as the source of its `Landis.Library.PnETCohorts-v2` reference.
  commit: 3c40197848b7b66c31882ce87d82037e42820737
